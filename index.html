<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>사과게임 🍎</title>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #f4f7f6; font-family: 'Pretendard', sans-serif; touch-action: none; user-select: none; overflow: hidden; display: flex; flex-direction: column; align-items: center; }
        
        /* 상단 UI */
        #header { width: 100%; max-width: 900px; display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; box-sizing: border-box; font-size: 22px; font-weight: 800; color: #2d3436; }
        .score-box { background: #ffeaa7; padding: 8px 20px; border-radius: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); color: #d63031; }
        .time-box { background: #dfe6e9; padding: 8px 20px; border-radius: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }

        /* 게임 보드 */
        #board-container { flex: 1; display: flex; align-items: center; justify-content: center; width: 100%; max-width: 900px; padding: 10px; box-sizing: border-box; }
        
        #board { display: grid; grid-template-columns: repeat(17, 1fr); gap: 3px; width: 100%; aspect-ratio: 17/10; background: #fff; padding: 8px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); position: relative; }
        
        /* 사과 디자인 (진짜 사과처럼) */
        .apple { 
            background: radial-gradient(circle at 30% 30%, #ff7675, #d63031); 
            border-radius: 40% 40% 50% 50% / 40% 40% 60% 60%; 
            color: white; display: flex; justify-content: center; align-items: center; 
            font-weight: 900; font-size: min(3.5vw, 24px); cursor: pointer; 
            position: relative; transition: all 0.15s ease; 
            box-shadow: inset -2px -2px 6px rgba(0,0,0,0.2), 0 3px 5px rgba(0,0,0,0.1);
        }
        /* 사과 꼭지(잎사귀) */
        .apple::before {
            content: ''; position: absolute; top: -4px; left: 50%; width: 6px; height: 10px;
            background: #55efc4; border-radius: 10px 0 10px 0; transform: translateX(-50%) rotate(15deg);
            box-shadow: inset 1px 1px 2px rgba(255,255,255,0.5);
        }
        
        /* 드래그 선택 시 효과 */
        .apple.selected { transform: scale(1.15); filter: brightness(1.2); box-shadow: 0 0 15px rgba(255, 234, 167, 1); z-index: 10; border: 2px solid #fdcb6e; }
        .apple.cleared { transform: scale(0); opacity: 0; pointer-events: none; }

        /* 예쁜 유리창 느낌의 모달 패널 */
        .panel { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(15px); padding: 35px 25px; border-radius: 25px; box-shadow: 0 15px 50px rgba(0,0,0,0.2); text-align: center; z-index: 100; width: 85%; max-width: 400px; display: none; border: 1px solid rgba(255,255,255,0.5); }
        .panel h1 { margin-top: 0; color: #d63031; font-size: 32px; font-weight: 900; letter-spacing: -1px; }
        .panel p { color: #636e72; font-size: 16px; line-height: 1.6; word-break: keep-all; }
        
        button { background: linear-gradient(135deg, #ff7675, #d63031); color: white; border: none; padding: 16px; font-size: 18px; border-radius: 12px; cursor: pointer; font-weight: bold; margin-top: 15px; width: 100%; box-shadow: 0 5px 15px rgba(214, 48, 49, 0.3); transition: 0.2s; }
        button:active { transform: translateY(2px); box-shadow: 0 2px 5px rgba(214, 48, 49, 0.3); }
        button.alt-btn { background: #b2bec3; box-shadow: 0 5px 15px rgba(0,0,0,0.1); color: #2d3436; }
        
        input { width: 100%; padding: 15px; margin: 15px 0; border-radius: 12px; border: 2px solid #dfe6e9; font-size: 18px; text-align: center; box-sizing: border-box; outline: none; font-weight: bold; transition: 0.2s; }
        input:focus { border-color: #ff7675; }
        
        /* 랭킹 리스트 디자인 */
        .leaderboard-list { list-style: none; padding: 0; margin: 20px 0; text-align: left; max-height: 250px; overflow-y: auto; }
        .leaderboard-list li { display: flex; justify-content: space-between; padding: 12px 10px; border-bottom: 1px solid #f1f2f6; font-size: 18px; color: #2d3436; font-weight: 600; }
        .leaderboard-list li span:nth-child(2) { color: #d63031; font-weight: 900; }
        .leaderboard-list li:nth-child(1) { background: #fff3cd; border-radius: 8px; border: none; }
        
        #startPanel { display: block; }
    </style>
</head>
<body>

    <div id="header">
        <div class="score-box">SCORE: <span id="score">0</span></div>
        <div class="time-box">⏳ <span id="time">120</span>초</div>
    </div>

    <div id="board-container">
        <div id="board"></div>
    </div>

    <!-- 시작 화면 -->
    <div class="panel" id="startPanel">
        <h1>사과게임 🍎</h1>
        <p>드래그해서 네모 칸을 만드세요!<br>선택된 사과 숫자의 합이 <b>정확히 10</b>이 되면<br>사과가 터지면서 점수를 얻습니다.</p>
        <button onclick="startGame()">▶ 게임 시작</button>
        <button onclick="showLeaderboard()" class="alt-btn">🏆 실시간 랭킹 보기</button>
    </div>

    <!-- 게임 오버 화면 -->
    <div class="panel" id="gameOverPanel">
        <h1 style="color: #2d3436;">Time Over!</h1>
        <p style="font-size: 22px;">최종 점수: <b id="finalScore" style="color: #d63031; font-size: 36px;">0</b>점</p>
        <input type="text" id="playerName" placeholder="닉네임 입력 (최대 10자)" maxlength="10">
        <button onclick="submitScore()" id="submitBtn">랭킹 등록하기</button>
        <button onclick="location.reload()" class="alt-btn">다시 하기</button>
    </div>

    <!-- 리더보드 화면 -->
    <div class="panel" id="leaderboardPanel">
        <h1>🏆 명예의 전당</h1>
        <ul class="leaderboard-list" id="leaderboardList">
            <li>로딩 중...⏳</li>
        </ul>
        <button onclick="closeLeaderboard()" class="alt-btn">닫기</button>
    </div>

<script>
    // 💡 보안 에러(CORS)를 피하기 위한 새로운 DB 설정 (text/plain 전송 방식 사용)
    const DB_URL = "https://kvdb.io/2UcwGvTjYwXG38w8YkU2d3/applegame_rank_fixed_v1";

    const COLS = 17;
    const ROWS = 10;
    let apples = [];
    let isDragging = false;
    let startX = -1, startY = -1;
    let currentX = -1, currentY = -1;
    let score = 0;
    let timeLeft = 120;
    let timerId = null;
    let isPlaying = false;

    const board = document.getElementById('board');

    function initGame() {
        board.innerHTML = '';
        apples = [];
        score = 0;
        timeLeft = 120;
        document.getElementById('score').innerText = score;
        document.getElementById('time').innerText = timeLeft;
        
        for(let y = 0; y < ROWS; y++) {
            for(let x = 0; x < COLS; x++) {
                let val = Math.floor(Math.random() * 9) + 1;
                let div = document.createElement('div');
                div.className = 'apple';
                div.innerText = val;
                div.dataset.x = x;
                div.dataset.y = y;
                board.appendChild(div);
                
                apples.push({ x: x, y: y, val: val, cleared: false, el: div });
            }
        }
    }

    // 터치/마우스 이벤트 처리
    function getTargetPos(e) {
        let clientX = e.touches ? e.touches[0].clientX : e.clientX;
        let clientY = e.touches ? e.touches[0].clientY : e.clientY;
        let target = document.elementFromPoint(clientX, clientY);
        return target;
    }

    function startDrag(e) {
        if(!isPlaying) return;
        let target = getTargetPos(e);
        if(!target || !target.classList.contains('apple')) return;
        
        isDragging = true;
        startX = parseInt(target.dataset.x);
        startY = parseInt(target.dataset.y);
        currentX = startX;
        currentY = startY;
        updateSelection();
        if(e.cancelable) e.preventDefault(); 
    }

    function doDrag(e) {
        if(!isDragging) return;
        let target = getTargetPos(e);
        if(target && target.classList.contains('apple')) {
            currentX = parseInt(target.dataset.x);
            currentY = parseInt(target.dataset.y);
            updateSelection();
        }
        if(e.cancelable) e.preventDefault();
    }

    function endDrag(e) {
        if(!isDragging) return;
        isDragging = false;
        checkSelectionSum();
    }

    function updateSelection() {
        let minX = Math.min(startX, currentX);
        let maxX = Math.max(startX, currentX);
        let minY = Math.min(startY, currentY);
        let maxY = Math.max(startY, currentY);

        apples.forEach(a => {
            if(!a.cleared) {
                if(a.x >= minX && a.x <= maxX && a.y >= minY && a.y <= maxY) {
                    a.el.classList.add('selected');
                } else {
                    a.el.classList.remove('selected');
                }
            }
        });
    }

    function checkSelectionSum() {
        let selected = apples.filter(a => a.el.classList.contains('selected') && !a.cleared);
        let sum = selected.reduce((acc, curr) => acc + curr.val, 0);

        if(sum === 10) {
            selected.forEach(a => {
                a.cleared = true;
                a.el.classList.remove('selected');
                a.el.classList.add('cleared'); 
            });
            score += selected.length * 10;
            document.getElementById('score').innerText = score;
        } else {
            apples.forEach(a => a.el.classList.remove('selected'));
        }
    }

    board.addEventListener('mousedown', startDrag);
    window.addEventListener('mousemove', doDrag);
    window.addEventListener('mouseup', endDrag);
    board.addEventListener('touchstart', startDrag, {passive: false});
    window.addEventListener('touchmove', doDrag, {passive: false});
    window.addEventListener('touchend', endDrag);

    function startGame() {
        document.getElementById('startPanel').style.display = 'none';
        initGame();
        isPlaying = true;
        
        timerId = setInterval(() => {
            timeLeft--;
            document.getElementById('time').innerText = timeLeft;
            if(timeLeft <= 0) {
                clearInterval(timerId);
                isPlaying = false;
                document.getElementById('gameOverPanel').style.display = 'block';
                document.getElementById('finalScore').innerText = score;
            }
        }, 1000);
    }

    // --- 강력해진 실시간 DB 통신 (CORS 에러 완벽 해결) ---
    async function fetchLeaderboard() {
        try {
            let res = await fetch(DB_URL);
            if (!res.ok) return [];
            let text = await res.text();
            return JSON.parse(text || "[]");
        } catch(e) {
            return [];
        }
    }

    async function showLeaderboard() {
        document.getElementById('startPanel').style.display = 'none';
        document.getElementById('gameOverPanel').style.display = 'none';
        document.getElementById('leaderboardPanel').style.display = 'block';
        const list = document.getElementById('leaderboardList');
        list.innerHTML = "<li>불러오는 중...⏳</li>";
        
        let data = await fetchLeaderboard();
        
        list.innerHTML = "";
        if (data.length === 0) {
            list.innerHTML = "<li>아직 등록된 점수가 없습니다!</li>";
            return;
        }
        
        data.sort((a, b) => b.score - a.score).slice(0, 15).forEach((entry, idx) => {
            let medal = idx === 0 ? "👑" : idx === 1 ? "🥈" : idx === 2 ? "🥉" : `${idx+1}.`;
            list.innerHTML += `<li><span>${medal} ${entry.name}</span> <span>${entry.score} pts</span></li>`;
        });
    }

    function closeLeaderboard() {
        document.getElementById('leaderboardPanel').style.display = 'none';
        if (!isPlaying && timeLeft === 120) { 
            document.getElementById('startPanel').style.display = 'block';
        }
    }

    async function submitScore() {
        const name = document.getElementById('playerName').value.trim() || "익명";
        const btn = document.getElementById('submitBtn');
        btn.innerText = "서버 기록 중...";
        btn.disabled = true;

        try {
            let data = await fetchLeaderboard();
            data.push({ name: name, score: score });
            data.sort((a, b) => b.score - a.score);
            data = data.slice(0, 20); // 탑 20명만 저장

            // 핵심: 'application/json' 대신 'text/plain'을 써서 브라우저 보안 차단을 회피함
            await fetch(DB_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain' },
                body: JSON.stringify(data)
            });

            document.getElementById('gameOverPanel').style.display = 'none';
            showLeaderboard();
        } catch(e) {
            alert("통신 오류! 잠시 후 다시 시도해주세요.");
            btn.innerText = "랭킹 등록하기";
            btn.disabled = false;
        }
    }
</script>
</body>
</html>
