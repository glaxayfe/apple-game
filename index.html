<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>사과게임 🍎 V2 </title>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        
        /* 🧸 1번 후보: 따뜻한 크림 베이지 배경 */
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #fff8e7; font-family: 'Pretendard', sans-serif; touch-action: none; user-select: none; overflow: hidden; display: flex; flex-direction: column; align-items: center; }
        
        /* 상단 UI (부드러운 브라운 텍스트) */
        #header { width: 100%; max-width: 800px; display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; box-sizing: border-box; font-size: 24px; font-weight: 800; color: #5c4a3d; }
        .score-box { background: #fff; padding: 10px 20px; border-radius: 12px; box-shadow: 0 4px 0 #f0e6d2; color: #ff6b6b; border: 2px solid #f0e6d2; }
        .time-box { background: #fff; padding: 10px 20px; border-radius: 12px; box-shadow: 0 4px 0 #f0e6d2; border: 2px solid #f0e6d2; }

        #board-container { flex: 1; display: flex; align-items: center; justify-content: center; width: 100%; max-width: 800px; padding: 10px; box-sizing: border-box; }
        
        /* 흔들림 없는 고정된 게임 보드 */
        #board { display: grid; grid-template-columns: repeat(17, 1fr); gap: 3px; width: 100%; aspect-ratio: 17/10; background: #fdf3df; padding: 8px; border-radius: 16px; border: 3px solid #f0e6d2; position: relative; }
        
        /* 🧸 사과 디자인 (둥글고 귀여운 무광 파스텔톤, 애니메이션 제거) */
        .apple { 
            background: #ff6b6b; 
            color: white; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            font-weight: 900; 
            font-size: min(3.5vw, 22px); 
            cursor: pointer; 
            border-radius: 50%; /* 완전한 동그라미 */
            box-shadow: 0 4px 0 #d93838; /* 아래쪽 입체감 그림자 */
            margin-bottom: 4px; /* 그림자 공간 */
        }
        
        /* 잎사귀 포인트 */
        .apple::after {
            content: ''; position: absolute; top: -2px; right: 2px; width: 6px; height: 6px;
            background: #8ce99a; border-radius: 50% 0 50% 0;
        }
        
        /* 드래그 선택 시 (크기 변화 없이 색만 노랗게) */
        .apple.selected { 
            background: #feca57; 
            box-shadow: 0 4px 0 #e59a18;
            color: #5c4a3d; 
        }
        
        /* 사과 터졌을 때 */
        .apple.cleared { 
            visibility: hidden; /* 공간은 차지하되 깔끔하게 사라짐 */
        }

        /* 팝업 모달창 (둥글둥글) */
        .panel { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #ffffff; padding: 35px 25px; border-radius: 24px; box-shadow: 0 10px 40px rgba(92, 74, 61, 0.2); text-align: center; z-index: 100; width: 85%; max-width: 380px; display: none; border: 4px solid #f0e6d2; }
        .panel h1 { margin-top: 0; color: #ff6b6b; font-size: 30px; font-weight: 900; }
        .panel p { color: #8e7b6d; font-size: 16px; line-height: 1.5; font-weight: 600; }
        
        button { background: #ff6b6b; color: white; border: none; padding: 16px; font-size: 18px; border-radius: 12px; cursor: pointer; font-weight: bold; margin-top: 15px; width: 100%; box-shadow: 0 4px 0 #d93838; }
        button:active { transform: translateY(4px); box-shadow: 0 0 0 transparent; } /* 누르는 손맛 */
        button.alt-btn { background: #ffd43b; color: #5c4a3d; box-shadow: 0 4px 0 #e59a18; }
        
        input { width: 100%; padding: 15px; margin: 15px 0; border-radius: 12px; border: 2px solid #f0e6d2; font-size: 18px; text-align: center; box-sizing: border-box; outline: none; font-weight: bold; color: #5c4a3d; background: #fff8e7; }
        input:focus { border-color: #ff6b6b; }
        
        /* 랭킹 리스트 */
        .leaderboard-list { list-style: none; padding: 0; margin: 20px 0; text-align: left; max-height: 250px; overflow-y: auto; font-weight: 700; color: #5c4a3d; }
        .leaderboard-list li { display: flex; justify-content: space-between; padding: 12px 15px; border-bottom: 2px dashed #f0e6d2; font-size: 18px; }
        .leaderboard-list li span:nth-child(2) { color: #ff6b6b; font-weight: 900; }
        .leaderboard-list li:nth-child(1) { background: #fdf3df; border-radius: 12px; border: none; }
        
        #startPanel { display: block; }
    </style>
</head>
<body>

    <div id="header">
        <div class="score-box">점수: <span id="score">0</span></div>
        <div class="time-box">⏳ <span id="time">90</span>초</div>
    </div>

    <div id="board-container">
        <div id="board"></div>
    </div>

    <!-- 시작 화면 -->
    <div class="panel" id="startPanel">
        <h1>사과게임 🍎</h1>
        <p>드래그해서 사과 숫자의 합을<br><b>정확히 10</b>으로 만드세요!<br><br>✨ 어지러움 방지 모드 켜짐 ✨</p>
        <button onclick="startGame()">▶ 90초 게임 시작</button>
        <button onclick="showLeaderboard()" class="alt-btn">🏆 실시간 랭킹 (친구내기용)</button>
    </div>

    <!-- 종료 화면 -->
    <div class="panel" id="gameOverPanel">
        <h1 style="color: #5c4a3d;">시간 종료!</h1>
        <p style="font-size: 22px;">최종 점수: <b id="finalScore" style="color: #ff6b6b; font-size: 36px;">0</b>점</p>
        <input type="text" id="playerName" placeholder="닉네임 (최대 10자)" maxlength="10">
        <button onclick="submitScore()" id="submitBtn">서버에 랭킹 등록하기</button>
        <button onclick="location.reload()" class="alt-btn" style="background: #f0e6d2; box-shadow: 0 4px 0 #dcd0b8;">다시 하기</button>
    </div>

    <!-- 랭킹 화면 -->
    <div class="panel" id="leaderboardPanel">
        <h1>🏆 명예의 전당</h1>
        <ul class="leaderboard-list" id="leaderboardList">
            <li>서버에서 불러오는 중...⏳</li>
        </ul>
        <button onclick="closeLeaderboard()" class="alt-btn">닫기</button>
    </div>

<script>
    // 🚀 보안 에러(CORS) 원천 차단! 친구들끼리 무조건 되는 고유 랭킹 방
    const RANK_ROOM = "apple_battle_friends_2026_top"; 

    const COLS = 17;
    const ROWS = 10;
    let apples = [];
    let isDragging = false;
    let startX = -1, startY = -1;
    let currentX = -1, currentY = -1;
    let score = 0;
    let timeLeft = 90; // 90초 룰
    let timerId = null;
    let isPlaying = false;

    const board = document.getElementById('board');

    function initGame() {
        board.innerHTML = '';
        apples = [];
        score = 0;
        timeLeft = 90; 
        document.getElementById('score').innerText = score;
        document.getElementById('time').innerText = timeLeft;
        
        for(let y = 0; y < ROWS; y++) {
            for(let x = 0; x < COLS; x++) {
                let val = Math.floor(Math.random() * 9) + 1;
                let div = document.createElement('div');
                div.className = 'apple';
                div.innerText = val;
                div.dataset.x = x;
                div.dataset.y = y;
                board.appendChild(div);
                
                apples.push({ x: x, y: y, val: val, cleared: false, el: div });
            }
        }
    }

    // 마우스 및 터치 드래그 기능 (흔들림 없음)
    function getTargetPos(e) {
        let clientX = e.touches ? e.touches[0].clientX : e.clientX;
        let clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return document.elementFromPoint(clientX, clientY);
    }

    function startDrag(e) {
        if(!isPlaying) return;
        let target = getTargetPos(e);
        if(!target || !target.classList.contains('apple')) return;
        
        isDragging = true;
        startX = parseInt(target.dataset.x);
        startY = parseInt(target.dataset.y);
        currentX = startX;
        currentY = startY;
        updateSelection();
        if(e.cancelable) e.preventDefault(); 
    }

    function doDrag(e) {
        if(!isDragging) return;
        let target = getTargetPos(e);
        if(target && target.classList.contains('apple')) {
            currentX = parseInt(target.dataset.x);
            currentY = parseInt(target.dataset.y);
            updateSelection();
        }
        if(e.cancelable) e.preventDefault();
    }

    function endDrag(e) {
        if(!isDragging) return;
        isDragging = false;
        checkSelectionSum();
    }

    function updateSelection() {
        let minX = Math.min(startX, currentX);
        let maxX = Math.max(startX, currentX);
        let minY = Math.min(startY, currentY);
        let maxY = Math.max(startY, currentY);

        apples.forEach(a => {
            if(!a.cleared) {
                if(a.x >= minX && a.x <= maxX && a.y >= minY && a.y <= maxY) {
                    a.el.classList.add('selected');
                } else {
                    a.el.classList.remove('selected');
                }
            }
        });
    }

    function checkSelectionSum() {
        let selected = apples.filter(a => a.el.classList.contains('selected') && !a.cleared);
        let sum = selected.reduce((acc, curr) => acc + curr.val, 0);

        if(sum === 10) {
            selected.forEach(a => {
                a.cleared = true;
                a.el.classList.remove('selected');
                a.el.classList.add('cleared'); // 효과 없이 즉시 깔끔하게 사라짐
            });
            score += selected.length * 10;
            document.getElementById('score').innerText = score;
        } else {
            apples.forEach(a => a.el.classList.remove('selected'));
        }
    }

    board.addEventListener('mousedown', startDrag);
    window.addEventListener('mousemove', doDrag);
    window.addEventListener('mouseup', endDrag);
    board.addEventListener('touchstart', startDrag, {passive: false});
    window.addEventListener('touchmove', doDrag, {passive: false});
    window.addEventListener('touchend', endDrag);

    function startGame() {
        document.getElementById('startPanel').style.display = 'none';
        initGame();
        isPlaying = true;
        
        timerId = setInterval(() => {
            timeLeft--;
            document.getElementById('time').innerText = timeLeft;
            if(timeLeft <= 0) {
                clearInterval(timerId);
                isPlaying = false;
                document.getElementById('gameOverPanel').style.display = 'block';
                document.getElementById('finalScore').innerText = score;
            }
        }, 1000);
    }

    // --- 🚀 통신 에러를 100% 막아내는 우회 방식 서버 (GET 메서드 전용) ---
    async function fetchLeaderboard() {
        try {
            // GET 방식으로 데이터 가져오기 (보안 차단 안 당함)
            let res = await fetch(`https://dweet.io/get/dweets/for/${RANK_ROOM}`);
            let data = await res.json();
            
            let ranks = [];
            if (data.with && data.with.length > 0) {
                data.with.forEach(d => {
                    if(d.content && d.content.name && d.content.score !== undefined) {
                        ranks.push({ name: d.content.name, score: parseInt(d.content.score) });
                    }
                });
            }
            
            // 이름별 최고 점수만 묶어주기
            let bestScores = {};
            ranks.forEach(r => {
                if(!bestScores[r.name] || bestScores[r.name] < r.score) {
                    bestScores[r.name] = r.score;
                }
            });
            
            let finalRanks = Object.keys(bestScores).map(k => ({ name: k, score: bestScores[k] }));
            finalRanks.sort((a, b) => b.score - a.score);
            return finalRanks.slice(0, 15); // 상위 15명

        } catch(e) {
            console.error(e);
            return [];
        }
    }

    async function showLeaderboard() {
        document.getElementById('startPanel').style.display = 'none';
        document.getElementById('gameOverPanel').style.display = 'none';
        document.getElementById('leaderboardPanel').style.display = 'block';
        const list = document.getElementById('leaderboardList');
        list.innerHTML = "<li>서버에서 불러오는 중...⏳</li>";
        
        let data = await fetchLeaderboard();
        
        list.innerHTML = "";
        if (data.length === 0) {
            list.innerHTML = "<li>등록된 랭킹이 없습니다! 첫 1등이 되어보세요.</li>";
            return;
        }
        
        data.forEach((entry, idx) => {
            let medal = idx === 0 ? "🥇" : idx === 1 ? "🥈" : idx === 2 ? "🥉" : `${idx+1}.`;
            list.innerHTML += `<li><span>${medal} ${entry.name}</span> <span>${entry.score}점</span></li>`;
        });
    }

    function closeLeaderboard() {
        document.getElementById('leaderboardPanel').style.display = 'none';
        if (!isPlaying && timeLeft === 90) { 
            document.getElementById('startPanel').style.display = 'block';
        }
    }

    async function submitScore() {
        let name = document.getElementById('playerName').value.trim();
        if(!name) name = "익명";
        const btn = document.getElementById('submitBtn');
        btn.innerText = "서버 전송 중...";
        btn.disabled = true;

        try {
            // 🚀 핵심 기술: 주소창으로 점수를 쏴버리기 (POST가 아니라 GET이라 절대 안 막힘)
            let sendUrl = `https://dweet.io/dweet/for/${RANK_ROOM}?name=${encodeURIComponent(name)}&score=${score}`;
            await fetch(sendUrl);

            document.getElementById('gameOverPanel').style.display = 'none';
            // 데이터 등록 시간을 위해 0.5초 대기 후 랭킹판 띄우기
            setTimeout(() => {
                showLeaderboard();
            }, 500);

        } catch(e) {
            alert("인터넷 연결을 확인해주세요!");
            btn.innerText = "서버에 랭킹 등록하기";
            btn.disabled = false;
        }
    }
</script>
</body>
</html>
