<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>사과게임 🍎 </title>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #fdf6e3; font-family: 'Pretendard', sans-serif; touch-action: none; user-select: none; overflow: hidden; display: flex; flex-direction: column; align-items: center; }
        
        /* 상단 UI (깔끔하고 고정된 형태) */
        #header { width: 100%; max-width: 800px; display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; box-sizing: border-box; font-size: 24px; font-weight: 900; color: #2d3436; }
        .score-box { background: #ffeaa7; padding: 10px 20px; border-radius: 8px; color: #d63031; }
        .time-box { background: #dfe6e9; padding: 10px 20px; border-radius: 8px; }

        /* 게임 보드 컨테이너 */
        #board-container { flex: 1; display: flex; align-items: center; justify-content: center; width: 100%; max-width: 800px; padding: 10px; box-sizing: border-box; }
        
        /* 17x10 그리드 - 흔들림 방지를 위해 고정된 크기 부여 */
        #board { display: grid; grid-template-columns: repeat(17, 1fr); gap: 2px; width: 100%; aspect-ratio: 17/10; background: #e3d5c8; padding: 5px; border-radius: 10px; position: relative; }
        
        /* 사과 디자인 (애니메이션 싹 다 제거, 눈 편안하게) */
        .apple { 
            background: #ff4757; 
            color: white; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            font-weight: 900; 
            font-size: min(3.5vw, 22px); 
            cursor: pointer; 
            border-radius: 4px;
            /* 애니메이션(transition, transform) 삭제로 어지러움 완벽 해결 */
        }
        
        /* 드래그 선택 시 (크기 안 변하고 색깔만 직관적으로 바뀜) */
        .apple.selected { 
            background: #feca57; 
            color: #2d3436; 
        }
        
        /* 사과 터졌을 때 (부드럽게 사라지는 효과 X, 즉시 투명화) */
        .apple.cleared { 
            background: transparent; 
            color: transparent; 
            pointer-events: none; 
        }

        /* 팝업 패널 */
        .panel { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #ffffff; padding: 35px 25px; border-radius: 15px; box-shadow: 0 10px 40px rgba(0,0,0,0.3); text-align: center; z-index: 100; width: 85%; max-width: 380px; display: none; border: 3px solid #2d3436; }
        .panel h1 { margin-top: 0; color: #d63031; font-size: 32px; font-weight: 900; }
        
        button { background: #d63031; color: white; border: none; padding: 16px; font-size: 18px; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 15px; width: 100%; }
        button.alt-btn { background: #2d3436; }
        
        input { width: 100%; padding: 15px; margin: 15px 0; border-radius: 8px; border: 2px solid #dfe6e9; font-size: 18px; text-align: center; box-sizing: border-box; outline: none; font-weight: bold; }
        input:focus { border-color: #d63031; }
        
        /* 랭킹 리스트 */
        .leaderboard-list { list-style: none; padding: 0; margin: 20px 0; text-align: left; max-height: 250px; overflow-y: auto; }
        .leaderboard-list li { display: flex; justify-content: space-between; padding: 12px 10px; border-bottom: 1px solid #f1f2f6; font-size: 18px; color: #2d3436; font-weight: 600; }
        .leaderboard-list li span:nth-child(2) { color: #d63031; font-weight: 900; }
        .leaderboard-list li:nth-child(1) { background: #fff3cd; border-radius: 8px; }
        
        #startPanel { display: block; }
    </style>
</head>
<body>

    <!-- 상단 UI -->
    <div id="header">
        <div class="score-box">점수: <span id="score">0</span></div>
        <div class="time-box">⏳ <span id="time">90</span>초</div>
    </div>

    <!-- 게임 판 -->
    <div id="board-container">
        <div id="board"></div>
    </div>

    <!-- 시작 화면 -->
    <div class="panel" id="startPanel">
        <h1>사과게임 🍎</h1>
        <p>드래그해서 사과 숫자의 합을<br><b>정확히 10</b>으로 만드세요!<br>(크기 안 변함 / 90초 룰)</p>
        <button onclick="startGame()">▶ 게임 시작</button>
        <button onclick="showLeaderboard()" class="alt-btn">🏆 실시간 랭킹</button>
    </div>

    <!-- 종료 화면 -->
    <div class="panel" id="gameOverPanel">
        <h1 style="color: #2d3436;">종료!</h1>
        <p style="font-size: 22px;">최종 점수: <b id="finalScore" style="color: #d63031; font-size: 36px;">0</b>점</p>
        <input type="text" id="playerName" placeholder="닉네임 (최대 10자)" maxlength="10">
        <button onclick="submitScore()" id="submitBtn">랭킹 등록하기</button>
        <button onclick="location.reload()" class="alt-btn">다시 하기</button>
    </div>

    <!-- 랭킹 화면 -->
    <div class="panel" id="leaderboardPanel">
        <h1>🏆 명예의 전당</h1>
        <ul class="leaderboard-list" id="leaderboardList">
            <li>데이터를 불러오는 중...</li>
        </ul>
        <button onclick="closeLeaderboard()" class="alt-btn">닫기</button>
    </div>

<script>
    // 💡 차단(CORS) 없는 100% 무결점 IoT 데이터베이스(Dweet) 사용
    const RANKING_ROOM_ID = "apple-game-ranking-super-battle-2026"; 

    const COLS = 17;
    const ROWS = 10;
    let apples = [];
    let isDragging = false;
    let startX = -1, startY = -1;
    let currentX = -1, currentY = -1;
    let score = 0;
    let timeLeft = 90;
    let timerId = null;
    let isPlaying = false;

    const board = document.getElementById('board');

    function initGame() {
        board.innerHTML = '';
        apples = [];
        score = 0;
        timeLeft = 90; 
        document.getElementById('score').innerText = score;
        document.getElementById('time').innerText = timeLeft;
        
        for(let y = 0; y < ROWS; y++) {
            for(let x = 0; x < COLS; x++) {
                let val = Math.floor(Math.random() * 9) + 1;
                let div = document.createElement('div');
                div.className = 'apple';
                div.innerText = val;
                div.dataset.x = x;
                div.dataset.y = y;
                board.appendChild(div);
                
                apples.push({ x: x, y: y, val: val, cleared: false, el: div });
            }
        }
    }

    // 마우스 및 터치 이벤트 로직
    function getTargetPos(e) {
        let clientX = e.touches ? e.touches[0].clientX : e.clientX;
        let clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return document.elementFromPoint(clientX, clientY);
    }

    function startDrag(e) {
        if(!isPlaying) return;
        let target = getTargetPos(e);
        if(!target || !target.classList.contains('apple')) return;
        
        isDragging = true;
        startX = parseInt(target.dataset.x);
        startY = parseInt(target.dataset.y);
        currentX = startX;
        currentY = startY;
        updateSelection();
        if(e.cancelable) e.preventDefault(); 
    }

    function doDrag(e) {
        if(!isDragging) return;
        let target = getTargetPos(e);
        if(target && target.classList.contains('apple')) {
            currentX = parseInt(target.dataset.x);
            currentY = parseInt(target.dataset.y);
            updateSelection();
        }
        if(e.cancelable) e.preventDefault();
    }

    function endDrag(e) {
        if(!isDragging) return;
        isDragging = false;
        checkSelectionSum();
    }

    // 드래그 박스 영역 하이라이트
    function updateSelection() {
        let minX = Math.min(startX, currentX);
        let maxX = Math.max(startX, currentX);
        let minY = Math.min(startY, currentY);
        let maxY = Math.max(startY, currentY);

        apples.forEach(a => {
            if(!a.cleared) {
                if(a.x >= minX && a.x <= maxX && a.y >= minY && a.y <= maxY) {
                    a.el.classList.add('selected');
                } else {
                    a.el.classList.remove('selected');
                }
            }
        });
    }

    // 합계 계산
    function checkSelectionSum() {
        let selected = apples.filter(a => a.el.classList.contains('selected') && !a.cleared);
        let sum = selected.reduce((acc, curr) => acc + curr.val, 0);

        if(sum === 10) {
            selected.forEach(a => {
                a.cleared = true;
                a.el.classList.remove('selected');
                a.el.classList.add('cleared'); // 애니메이션 없이 바로 투명해짐
            });
            score += selected.length * 10;
            document.getElementById('score').innerText = score;
        } else {
            apples.forEach(a => a.el.classList.remove('selected'));
        }
    }

    board.addEventListener('mousedown', startDrag);
    window.addEventListener('mousemove', doDrag);
    window.addEventListener('mouseup', endDrag);
    board.addEventListener('touchstart', startDrag, {passive: false});
    window.addEventListener('touchmove', doDrag, {passive: false});
    window.addEventListener('touchend', endDrag);

    // 게임 타이머
    function startGame() {
        document.getElementById('startPanel').style.display = 'none';
        initGame();
        isPlaying = true;
        
        timerId = setInterval(() => {
            timeLeft--;
            document.getElementById('time').innerText = timeLeft;
            if(timeLeft <= 0) {
                clearInterval(timerId);
                isPlaying = false;
                document.getElementById('gameOverPanel').style.display = 'block';
                document.getElementById('finalScore').innerText = score;
            }
        }, 1000);
    }

    // --- 절대 막히지 않는 실시간 랭킹 (Dweet API) ---
    async function fetchLeaderboard() {
        try {
            let res = await fetch(`https://dweet.io/get/latest/dweet/for/${RANKING_ROOM_ID}`);
            if (!res.ok) return [];
            let data = await res.json();
            
            // 데이터가 존재하면 랭킹 배열을 반환
            if (data.this === "succeeded" && data.with && data.with.length > 0) {
                return data.with[0].content.leaderboard || [];
            }
            return [];
        } catch(e) {
            console.error(e);
            return [];
        }
    }

    async function showLeaderboard() {
        document.getElementById('startPanel').style.display = 'none';
        document.getElementById('gameOverPanel').style.display = 'none';
        document.getElementById('leaderboardPanel').style.display = 'block';
        const list = document.getElementById('leaderboardList');
        list.innerHTML = "<li>서버에서 불러오는 중...⏳</li>";
        
        let data = await fetchLeaderboard();
        
        list.innerHTML = "";
        if (!data || data.length === 0) {
            list.innerHTML = "<li>등록된 랭킹이 없습니다! 1등을 차지하세요!</li>";
            return;
        }
        
        data.sort((a, b) => b.score - a.score).slice(0, 15).forEach((entry, idx) => {
            let medal = idx === 0 ? "🥇" : idx === 1 ? "🥈" : idx === 2 ? "🥉" : `${idx+1}.`;
            list.innerHTML += `<li><span>${medal} ${entry.name}</span> <span>${entry.score}점</span></li>`;
        });
    }

    function closeLeaderboard() {
        document.getElementById('leaderboardPanel').style.display = 'none';
        if (!isPlaying && timeLeft === 90) { 
            document.getElementById('startPanel').style.display = 'block';
        }
    }

    async function submitScore() {
        const name = document.getElementById('playerName').value.trim() || "익명";
        const btn = document.getElementById('submitBtn');
        btn.innerText = "서버 기록 중...";
        btn.disabled = true;

        try {
            // 1. 현재 랭킹 불러오기
            let currentBoard = await fetchLeaderboard();
            
            // 2. 내 점수 추가하고 정렬
            currentBoard.push({ name: name, score: score });
            currentBoard.sort((a, b) => b.score - a.score);
            currentBoard = currentBoard.slice(0, 20); // 탑 20명만 유지

            // 3. 서버에 저장 (CORS 차단 없음)
            await fetch(`https://dweet.io/dweet/for/${RANKING_ROOM_ID}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ leaderboard: currentBoard })
            });

            document.getElementById('gameOverPanel').style.display = 'none';
            showLeaderboard();
        } catch(e) {
            alert("통신 오류! 잠시 후 다시 시도해주세요.");
            btn.innerText = "랭킹 등록하기";
            btn.disabled = false;
        }
    }
</script>
</body>
</html>
